<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSDA - Front Desk Pro (ระบบหนังสือส่ง)</title>
    
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --kmitl: #ea580c; --dark: #1e293b; }
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; margin: 0; padding: 10px 0; }
        @media (min-width: 640px) { body { padding: 20px 0; } }

        .app-container { max-width: 900px; margin: 0 auto; background-color: #ffffff; min-height: 90vh; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; position: relative; }
        
        .input-box { 
            width: 100%; padding: 14px 16px; border-radius: 16px; 
            border: 1.5px solid #f1f5f9; font-size: 15px; outline: none; 
            background-color: #f8fafc; color: #334155; transition: all 0.2s ease; 
        }
        .input-box:focus:not([readonly]) { 
            border-color: #fdba74; background: #ffffff; 
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.05); 
        }
        .input-box[readonly], .input-box:disabled { 
            background-color: #f1f5f9; cursor: not-allowed; color: #64748b; 
            font-weight: bold; border-color: transparent; 
        }
        .form-label { 
            font-size: 11.5px; font-weight: 700; color: #94a3b8; 
            margin-bottom: 8px; margin-left: 6px; text-transform: uppercase; 
            letter-spacing: 0.05em; display: block; 
        }
        .btn-submit { 
            background: linear-gradient(135deg, #f97316, #ea580c); 
            color: white; width: 100%; font-weight: 800; padding: 16px; 
            border-radius: 16px; border: none; cursor: pointer; margin-top: 10px; 
            box-shadow: 0 6px 20px -4px rgba(234, 88, 12, 0.4);
            transition: all 0.2s ease;
        }
        .btn-submit:active { transform: scale(0.97); box-shadow: 0 2px 10px -2px rgba(234, 88, 12, 0.3); }

        #f_seq {
            background-color: #fff7ed !important; 
            border: 3px solid #ea580c !important; 
            font-size: 32px !important;
            font-weight: 900 !important;
            padding: 16px !important;
            border-radius: 16px !important;
            color: #ea580c !important; 
            width: 100%;
            text-align: center !important;
            letter-spacing: 2px !important;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.1) !important;
            outline: none !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
        }

        .page-section { display: none; animation: fadeIn 0.3s ease; }
        .page-section.active { display: block; }
        @media (prefers-reduced-motion: reduce) { .page-section { animation: none; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .table-row-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-left: 4px solid transparent; }
        .row-normal { background-color: #f8fafc; }
        .row-normal:hover { background-color: #f0fdf4; border-left: 4px solid #22c55e; transform: scale(1.005); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.08); z-index: 10; position: relative; }
        .row-backfill { background-color: #fffbeb; }
        .row-backfill:hover { background-color: #fef3c7; border-left: 4px solid #eab308; transform: scale(1.005); box-shadow: 0 4px 15px rgba(234, 179, 8, 0.08); z-index: 10; position: relative; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* 🌟 CSS เพิ่มเติมสำหรับ Dropdown ประวัติ */
        .history-dropdown {
            display: none; position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px;
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); z-index: 50; max-height: 220px; overflow-y: auto;
        }
        .history-item {
            padding: 10px 14px; font-size: 13px; color: #475569; cursor: pointer;
            transition: all 0.15s ease; border-bottom: 1px solid #f1f5f9;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item:hover { background-color: #fff7ed; color: #ea580c; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-100">

<div class="app-container">
    
    <div id="pageHub" class="page-section active" style="position: relative;">
        
        <div style="position: absolute; top: 16px; right: 16px; z-index: 999; display: flex; gap: 8px;">
            <button onclick="window.location.href='index.html'" class="flex items-center justify-center w-10 h-10 rounded-full bg-white border border-slate-200 shadow-sm cursor-pointer hover:bg-slate-50 transition-colors" title="กลับหน้าเลือกระบบ">
                <i data-lucide="layout-grid" class="text-slate-600 hover:scale-110 transition-transform duration-300" style="width: 18px; height: 18px;"></i>
            </button>
            <button onclick="openSettingsModal()" class="flex items-center justify-center w-10 h-10 rounded-full bg-white border border-slate-200 shadow-sm cursor-pointer hover:bg-slate-50 transition-colors" title="ตั้งค่าระบบหลังบ้าน">
                <i data-lucide="settings" class="text-orange-500 hover:rotate-45 transition-transform duration-300" style="width: 20px; height: 20px;"></i>
            </button>
        </div>
        
        <div class="p-5 sm:p-8 border-b border-slate-100 bg-white">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6 sm:mb-8">
                <div class="pr-32 sm:pr-0">
                    <h1 class="text-2xl sm:text-3xl font-black text-slate-800 leading-none">
                        OSDA <span class="text-orange-600">FRONT</span>
                    </h1>
                    <p class="text-xs font-bold text-slate-400 mt-1">ระบบลงทะเบียนหนังสือส่ง</p>
                    <div id="currentUserBadge" class="text-[11px] text-emerald-600 font-bold mt-1.5 flex items-center gap-1 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-100 w-fit">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="txtCurrentUser">กำลังตรวจสอบสิทธิ์...</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                <button onclick="openForm('new')" class="bg-emerald-600 hover:bg-emerald-700 text-white p-4 sm:p-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-emerald-600/30 transition-all transform hover:-translate-y-1">
                    <i data-lucide="send" class="w-6 h-6 sm:w-8 sm:h-8"></i>
                    <span class="text-lg sm:text-xl font-bold">ส่งหนังสือปกติ</span>
                </button>
                <button onclick="openForm('backfill')" class="bg-amber-500 hover:bg-amber-600 text-white p-4 sm:p-6 rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-amber-500/30 transition-all transform hover:-translate-y-1">
                    <i data-lucide="history" class="w-6 h-6 sm:w-8 sm:h-8"></i>
                    <span class="text-lg sm:text-xl font-bold">ส่งหนังสือย้อนหลัง</span>
                </button>
            </div>
        </div>

        <div class="bg-slate-50 p-4 sm:p-8 min-h-[500px]">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b-2 border-slate-800 pb-3 mb-4 sm:mb-6 gap-3 sm:gap-4">
                <h3 class="text-sm font-black text-slate-500 tracking-wider uppercase flex items-center gap-2">
                    <i data-lucide="database" class="w-4 h-4"></i> ทะเบียนส่งทั้งหมด
                </h3>
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="relative w-full sm:w-80">
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ค้นหา เรื่อง, ทะเบียน, จาก, ถึง..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-300 rounded-xl text-sm focus:border-orange-500 focus:ring-2 focus:ring-orange-100 outline-none shadow-sm transition-all">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
                <div class="min-w-[800px]">
                    <div class="bg-[#1e293b] text-white text-xs font-bold p-3 grid grid-cols-12 gap-4 items-center">
                        <div class="col-span-2 text-center">ทะเบียน</div>
                        <div class="col-span-4">รายละเอียดหนังสือ</div>
                        <div class="col-span-2 text-center">สถานะ</div>
                        <div class="col-span-2 text-center">เวลาส่งจริง</div>
                        <div class="col-span-2 text-center">จัดการ</div>
                    </div>
                    <div id="recordList" class="flex flex-col divide-y divide-slate-100">
                    </div>
                </div>
            </div>
            
            <div id="paginationControls" class="flex justify-between items-center mt-6">
                <button onclick="changePage(-1)" id="btnPrev" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600 disabled:opacity-30 hover:bg-slate-50 transition shadow-sm">ก่อนหน้า</button>
                <span id="pageInfo" class="text-xs font-bold text-slate-500 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm"></span>
                <button onclick="changePage(1)" id="btnNext" class="px-4 py-2 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-600 disabled:opacity-30 hover:bg-slate-50 transition shadow-sm">ถัดไป</button>
            </div>
        </div>
    </div>

    <div id="pageForm" class="page-section bg-white min-h-full pb-10">
        <div class="flex items-center gap-3 sm:gap-4 p-4 sm:p-6 border-b border-slate-100 sticky top-0 bg-white z-10 shadow-sm">
            <button onclick="goHome()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h2 id="formTitle" class="font-bold text-lg sm:text-xl text-slate-800">บันทึกส่งหนังสือ</h2>
            
            <div class="ml-auto flex items-center gap-3">
                <div id="syncHistoryStatus" class="text-[10px] font-bold text-slate-400 flex items-center gap-1 hidden">
                    <svg class="animate-spin h-3 w-3 text-orange-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    โหลดประวัติ...
                </div>
                <div id="formStatusBadge" class="px-3 py-1 sm:px-4 sm:py-1.5 rounded-full text-[10px] sm:text-xs font-black uppercase tracking-wider border"></div>
                <input type="hidden" id="f_status">
            </div>
        </div>

        <form id="docForm" onsubmit="saveData(event)" class="p-4 sm:p-8 space-y-4 max-w-2xl mx-auto">
            <input type="hidden" id="f_id">
            
            <div>
                <div class="flex justify-between items-end mb-1 px-1">
                    <label class="form-label !mb-0">เลขทะเบียนส่ง (อัตโนมัติ)</label>
                    <button type="button" id="btnReuseSeq" onclick="checkAndReuseDeletedSeq()" class="px-2 py-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 rounded-lg text-[10px] font-black flex items-center gap-1 shadow-sm transition-all whitespace-nowrap">
                        <i data-lucide="list-restart" class="w-3 h-3"></i> ดึงเลขที่ว่าง
                    </button>
                </div>
                <input type="text" id="f_seq" readonly>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="form-label">ลงวันที่ส่งจริง</label><input type="date" id="f_logDate" class="input-box font-bold" required onchange="calculateSequence()"></div>
                <div><label class="form-label">เวลาส่งจริง</label><input type="time" id="f_logTime" class="input-box font-bold" required></div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="form-label">จาก (ผู้ส่ง)</label><input type="text" id="f_sender" class="input-box" required placeholder="ระบุหน่วยงานหรือผู้ส่ง..."></div>
                <div><label class="form-label">ถึง (ผู้รับ)</label><input type="text" id="f_receiver" class="input-box" required placeholder="ระบุผู้รับปลายทาง..."></div>
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-1 px-1 mt-2">
                    <label class="form-label !mb-0">หน่วยรับ</label>
                </div>
                <input type="text" id="f_recUnit" class="input-box" placeholder="ระบุหน่วยงานภายใน หรือชื่อผู้รับเรื่อง..." autocomplete="off">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1 px-1">
                    <label class="form-label !mb-0">เรื่อง</label>
                </div>
                <div class="relative flex items-center">
                    <input type="text" id="f_subject" class="input-box font-bold pr-12" required placeholder="ระบุชื่อเรื่องหรือวัตถุประสงค์..." autocomplete="off">
                    <button type="button" onclick="toggleHistoryDropdown('subject')" class="absolute right-2 p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 transition-colors select-none" title="เลือกจากประวัติล่าสุด">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </button>
                    <div id="subjectHistoryDropdown" class="history-dropdown"></div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1 px-1">
                    <label class="form-label !mb-0">หมายเหตุ / การปฏิบัติ</label>
                </div>
                <div class="relative flex items-center">
                    <input type="text" id="f_remark" class="input-box pr-12" placeholder="(ถ้ามี)" autocomplete="off">
                    <button type="button" onclick="toggleHistoryDropdown('remark')" class="absolute right-2 p-1.5 hover:bg-slate-200 rounded-lg text-slate-500 transition-colors select-none" title="เลือกจากประวัติล่าสุด">
                        <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </button>
                    <div id="remarkHistoryDropdown" class="history-dropdown"></div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-100 pt-4 mt-2">
                <div><label class="form-label">วันที่บันทึก (System Date)</label><input type="date" id="f_sysDate" class="input-box text-xs !text-slate-400" readonly></div>
                <div><label class="form-label">เวลาบันทึก (System Time)</label><input type="time" step="1" id="f_sysTime" class="input-box text-xs !text-slate-400" readonly></div>
            </div>
            
            <div class="pt-2">
                <label class="form-label">แนบรูปภาพเอกสาร (ถ้ามี)</label>
                <div id="dropZone" class="p-6 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 text-center hover:bg-slate-100 transition-all cursor-pointer relative group" onclick="document.getElementById('f_fileInput').click()">
                    <input type="file" id="f_fileInput" class="hidden" accept="image/*">
                    <div class="flex flex-col items-center justify-center gap-3 pointer-events-none">
                        <div class="bg-white p-3 rounded-full shadow-sm text-blue-500 group-hover:scale-110 transition-transform"><i data-lucide="image" class="w-6 h-6"></i></div>
                        <div>
                            <span class="text-sm font-bold text-slate-600 block">คลิก หรือ ลากไฟล์ภาพมาวางที่นี่</span>
                            <span class="text-[10px] font-medium text-slate-400 mt-1 block">(รองรับเฉพาะไฟล์รูปภาพ JPG, PNG)</span>
                        </div>
                    </div>
                    <img id="imagePreview" src="" class="w-16 h-16 object-cover rounded-xl border border-slate-200 shadow-sm mx-auto mt-4 hidden" onclick="event.stopPropagation()">
                    <div id="f_fileStatus" class="text-xs text-orange-600 font-bold mt-3"></div>
                </div>
                <input type="hidden" id="f_fileUrl" value="ไม่มีไฟล์"> 
            </div>
            
            <button type="submit" id="btnSubmit" class="btn-submit flex justify-center items-center gap-2 mt-6">
                <i data-lucide="save" class="w-5 h-5"></i> บันทึกข้อมูลหนังสือส่ง
            </button>
        </form>
    </div>
</div>

<script>

// 1. ใส่รายชื่ออีเมลแอดมิน (มีแค่คุณ กับ พี่ต้น)
const ADMIN_EMAILS = [
    "66040181@kmitl.ac.th", 
    "admin-osda@kmitl.ac.th",
    "sharnjira.ki@kmitl.ac.th"
];

// 2. ฟังก์ชันล็อก/ปลดล็อกช่องกรอกข้อมูล
function setupPermissions(userEmail) {
    const cleanEmail = userEmail ? userEmail.trim().toLowerCase() : "";
    const isAdmin = ADMIN_EMAILS.includes(cleanEmail);

    const docNumberInput = document.getElementById("f_seq");      
    const docDateInput = document.getElementById("f_logDate");    
    const docTimeInput = document.getElementById("f_logTime");    
    const sysDateInput = document.getElementById("f_sysDate");    

    // 🌟 ให้ทุกคนแก้วันที่/เวลา เพื่อลงย้อนหลังได้เสมอ
    if(docDateInput) { docDateInput.readOnly = false; docDateInput.style.backgroundColor = "#ffffff"; }
    if(docTimeInput) { docTimeInput.readOnly = false; docTimeInput.style.backgroundColor = "#ffffff"; }

    if (!isAdmin) {
        // 🔒 โหมดคนทั่วไป: ปิดตายช่องเลขที่ และ วันที่ระบบ (ห้ามพิมพ์ ห้ามโฟกัส)
        if(docNumberInput) { 
            docNumberInput.readOnly = true; 
            docNumberInput.disabled = true; // ท่าไม้ตาย ล็อกการคลิก
            docNumberInput.style.setProperty('background-color', '#e9ecef', 'important');
            docNumberInput.style.setProperty('border-color', '#cbd5e1', 'important');
            docNumberInput.style.setProperty('color', '#94a3b8', 'important');
            docNumberInput.style.setProperty('cursor', 'not-allowed', 'important');
        }
        if(sysDateInput) { sysDateInput.readOnly = true; sysDateInput.disabled = true; }
    } else {
        // 🔓 โหมดแอดมิน: ปลดล็อก พิมพ์และคลิกได้ปกติ
        if(docNumberInput) { 
            docNumberInput.readOnly = false; 
            docNumberInput.disabled = false;
            docNumberInput.style.setProperty('background-color', '#fff7ed', 'important');
            docNumberInput.style.setProperty('border-color', '#ea580c', 'important');
            docNumberInput.style.setProperty('color', '#ea580c', 'important');
            docNumberInput.style.setProperty('cursor', 'text', 'important');
        }
        if(sysDateInput) { sysDateInput.readOnly = false; sysDateInput.disabled = false; }
    }
}
    const isLocalFile = window.location.protocol === 'file:';
    if (!isLocalFile && sessionStorage.getItem('osda_auth') !== 'true') {
        window.location.href = 'index.html';
    }

    let WEB_APP_URL = localStorage.getItem('OSDA_SENDER_WEB_APP_URL') || "https://script.google.com/macros/s/AKfycbyosCfz7kBkreEZsgMb8EEAlvuImplwhAuu2aBdlO50eTU8AzYfx0_YUIjPh5eRiXufMQ/exec";
    let IMGBB_API_KEY = localStorage.getItem('OSDA_SENDER_IMGBB_KEY') || "943c4187147fb6507b61c2c6de104cfa";

    localforage.config({ name: 'OSDA_STORAGE_SENDER' });
    
    let db = []; 
    let currentMode = 'hub'; 
    let realTimeClock; 
    let currentPage = 1;
    const itemsPerPage = 6; 
    let filteredRecords = []; 
    let recentHistoryData = { subjects: [], remarks: [] }; // ตัวแปรเก็บประวัติ

    const USER_MAPPING = {
        "66040181@kmitl.ac.th": "เขต",
        "66040190@kmitl.ac.th": "มดแดง",
        "wiphawan.su@kmitl.ac.th": "พี่วิภาวรรณ สุขดี",
        "surachai.ra@kmitl.ac.th": "พี่สุรชัย รักเรียน",
        "nattapong.du@kmitl.ac.th": "พี่ณัฐพงษ์ ดวงดี",
        "jaruwan.fa@kmitl.ac.th": "พี่จารuวรรณ ใฝ่ดี",
        "thanapon.ud@kmitl.ac.th": "พี่ธนพล อุดมสุข",
        "ketsarin.ja@kmitl.ac.th": "พี่เกศรินทร์ เจริญใจ",
        "pongsatorn.ma@kmitl.ac.th": "พี่พงศธร มั่นคง",
        "ariya.me@kmitl.ac.th": "พี่อารียา เมตตา",
        "theerapong.ru@kmitl.ac.th": "พี่ธีรพงศ์ รุ่งเรือง",

    async function syncDataFromCloud(isBackground = false) {
        const container = document.getElementById('recordList');
        if(container && !isBackground && db.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16 text-blue-600 font-bold flex flex-col items-center justify-center gap-3">
                    <svg class="animate-spin h-10 w-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>กำลังซิงก์ข้อมูลทะเบียนส่งล่าสุดจากส่วนกลาง...</span>
                </div>`;
        }

        try {
            const response = await fetch(`${WEB_APP_URL}?action=getAll&sheetType=sender`);
            const data = await response.json();
            
            if (data.status === 'success' && data.data) {
                db = data.data.map(r => ({
                    ...r,
                    creator: String(r.creator || ''),
                    editor: String(r.editor || ''),
                    fileUrl: String(r.hasFile || 'ไม่มีไฟล์')
                })).reverse(); 
            } else {
                db = [];
            }
        } catch (err) {
            console.error("Sync Error:", err);
        } finally {
            handleSearch(); 
        }
    }

    async function calculateSequence() {
        if (document.getElementById('f_id').value) return; 
        const targetDate = document.getElementById('f_logDate').value;
        if (!targetDate) return;

        const seqEl = document.getElementById('f_seq');
        seqEl.value = "กำลังดึงเลข..."; 

        try {
            // 1. ดึงค่าจากหลังบ้านมาก่อน (หลังบ้านอาจจะส่งทศนิยมมามั่วๆ)
            const response = await fetch(`${WEB_APP_URL}?action=getSeq&sheetType=sender&mode=${currentMode}&date=${targetDate}`);
            const data = await response.json();
            let rawSeq = (data.status === 'success' && data.seq) ? data.seq : "0001"; 

            // 🌟 2. ด่านตรวจ: ดักจับและแก้บั๊กทศนิยมมั่วสำหรับ "ส่งย้อนหลัง"
            if (currentMode === 'backfill' && rawSeq.includes('.')) {
                let baseMain = rawSeq.split('.')[0]; // หั่นเอาแค่เลขหลัก เช่น "0026"
                
                // ค้นหาทศนิยมทั้งหมดในตาราง (db) เฉพาะที่เป็นของ "0026"
                let existingDecimals = db
                    .map(item => String(item.seq).trim())
                    .filter(s => s.startsWith(baseMain + '.'))
                    .map(s => parseInt(s.split('.')[1], 10))
                    .filter(n => !isNaN(n));
                
                // หาค่าทศนิยมที่รันไปแล้วของกลุ่มนี้ (ถ้าไม่มีให้เป็น 0) แล้วบวก 1 เข้าไป!
                let correctMaxSub = existingDecimals.length > 0 ? Math.max(...existingDecimals) : 0;
                seqEl.value = baseMain + '.' + String(correctMaxSub + 1).padStart(2, '0');
            } else {
                // ถ้าเป็นส่งปกติ ก็ใช้เลขที่หลังบ้านส่งมาได้เลย
                seqEl.value = rawSeq; 
            }
        } catch (err) {
            console.error("Calculate Seq Error:", err);
            seqEl.value = "0001"; 
        }
    }

    async function processFileUpload(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            Swal.fire({ icon: 'error', title: 'ไฟล์ไม่รองรับ', text: 'ระบบแนบไฟล์นี้ รองรับเฉพาะการอัปโหลดไฟล์รูปภาพ (JPG, PNG) เท่านั้นครับ' });
            return;
        }
        if (!IMGBB_API_KEY) {
            Swal.fire({ icon: 'warning', title: 'ยังไม่ได้ตั้งค่าคีย์ฝากรูป', text: 'กรุณากดปุ่มฟันเฟือง ⚙️ ด้านขวาบน เพื่อใส่ IMGBB API KEY ของคุณก่อนครับ' });
            return;
        }

        document.getElementById('f_fileStatus').innerHTML = '<span class="text-orange-500 font-bold">⌛ กำลังแปลงและส่งรูปภาพขึ้นคลาวด์...</span>';
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function(e) {
            const previewImg = document.getElementById('imagePreview');
            if (previewImg) { previewImg.src = e.target.result; previewImg.classList.remove('hidden'); }

            try {
                const base64Image = e.target.result.split(',')[1];
                const formData = new FormData();
                formData.append('image', base64Image);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.success && result.data && result.data.url) {
                    document.getElementById('f_fileUrl').value = result.data.url;
                    document.getElementById('f_fileStatus').innerHTML = `✅ แนบไฟล์สำเร็จ! <br><a href="${result.data.url}" target="_blank" onclick="event.stopPropagation()" class="text-blue-600 underline font-black text-[11px] mt-1 inline-block relative z-10">คลิกเพื่อดูรูปภาพแบบเต็ม</a>`;
                    Toast.fire({ icon: 'success', title: 'อัปโหลดภาพเสร็จสิ้น!' });
                } else { throw new Error("Upload Failed"); }
            } catch (err) { 
                document.getElementById('f_fileStatus').innerHTML = '<span class="text-red-500 font-bold">❌ อัปโหลดล้มเหลว ตรวจสอบ API Key</span>';
                document.getElementById('imagePreview').classList.add('hidden');
            } finally { fileInput.value = ""; }
        };
    }

    function cleanTimeFormat(timeVal) {

    }

    function formatThaiDateShort(dateStr) {
    if (!dateStr) return "-";
    // แยกข้อความตรงๆ เพื่อตัดปัญหาเรื่อง Timezone ของเครื่องผู้ใช้งานเลื่อน
    const parts = String(dateStr).split('-');
    if (parts.length === 3) {
        const year = parts[0].substring(2); // เอาเฉพาะ 2 หลักท้าย เช่น 2026 -> 26
        const month = parts[1];
        const day = parts[2];
        return `${day}/${month}/${year}`;
    }
    return dateStr;
}

   function renderList() {

        document.getElementById('paginationControls').style.display = 'flex';
        document.getElementById('pageInfo').innerText = `หน้า ${currentPage} / ${totalPages}`;
        document.getElementById('btnPrev').disabled = (currentPage === 1);
        document.getElementById('btnNext').disabled = (currentPage === totalPages);
        
        const start = (currentPage - 1) * itemsPerPage;
        const pageItems = filteredRecords.slice().reverse().slice(start, start + itemsPerPage);
        
        // 🌟 ดึงข้อมูลเมลเพื่อเช็กสิทธิ์ก่อนสร้างตาราง
        const currentUserEmail = sessionStorage.getItem('osda_user_email');

                    <button onclick="editRecord('${r.id}')" class="px-3 py-1 bg-white border border-slate-300 text-slate-600 hover:border-blue-500 hover:text-blue-600 rounded text-[11px] font-bold transition-all shadow-sm">แก้ไข</button>
                    ${driveBtnHtml}
                    <button onclick="deleteRecord('${r.id}')" class="px-3 py-1 bg-white border border-slate-300 text-slate-600 hover:border-red-500 hover:text-red-600 rounded text-[11px] font-bold transition-all shadow-sm">ลบ</button>
                `;
            }

            container.innerHTML += `
                <div class="${rowClass} table-row-hover p-4 grid grid-cols-12 gap-4 items-center border-b border-slate-100 min-h-[80px]">
                    <div class="col-span-2 flex justify-center items-center"><span class="font-black text-slate-700 bg-white px-3 py-1.5 rounded-lg border border-slate-200 text-sm shadow-sm"># ${r.seq}</span></div>
                    <div class="col-span-4 flex flex-col justify-center gap-0.5">
                        <div class="font-bold text-slate-800 text-sm leading-snug">${r.subject}</div>
                        <div class="text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-0.5"><span><b>จาก:</b> ${r.sender || '-'}</span><span><b>ถึง:</b> ${r.receiver || '-'}</span></div>
                        ${userTrackHtml}
                    </div>
                    <div class="col-span-2 flex justify-center items-center">${statusBadge}</div>
                    <div class="col-span-2 text-xs text-slate-600 flex flex-col justify-center items-center">
                        <div class="font-bold text-slate-800 mb-0.5">${formatThaiDateShort(r.logDate)}</div>
                        <div class="text-[10px] text-slate-400">เวลา: ${cleanTimeFormat(r.logTime) || '-'}</div>
                    </div>
                    <div class="col-span-2 flex flex-row flex-wrap justify-center items-center gap-2">
                        ${actionButtonsHtml}
                    </div>
                </div>
            `;
        });
        lucide.createIcons();
    }

    window.editRecord = (id) => {
        const data = db.find(x => String(x.id) === String(id));
        if(!data) return;

        currentMode = 'edit'; 
        clearInterval(realTimeClock); 
        hideAllHistoryDropdowns();

        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.getElementById('pageForm').classList.add('active');
        
        document.getElementById('formTitle').innerText = 'แก้ไขรายละเอียดหนังสือส่ง';
        document.getElementById('f_id').value = data.id;
        document.getElementById('f_seq').value = data.seq; 
        document.getElementById('f_sysDate').value = data.sysDate || data.logDate;
        document.getElementById('f_sysTime').value = data.sysTime || '';
        document.getElementById('f_logDate').value = data.logDate;
        document.getElementById('f_logTime').value = cleanTimeFormat(data.logTime) || '';
        document.getElementById('f_sender').value = data.sender || '';
        document.getElementById('f_receiver').value = data.receiver || '';
        document.getElementById('f_recUnit').value = data.recUnit || ''; // ดึงค่าหน่วยรับมาโชว์ตอนแก้ไข
        document.getElementById('f_subject').value = data.subject || '';
        document.getElementById('f_remark').value = data.remark || '';
        document.getElementById('f_status').value = data.status;
        
        const badge = document.getElementById('formStatusBadge');
        if (data.status === 'ส่งย้อนหลัง') {
            badge.innerText = 'ย้อนหลัง';
            badge.className = "px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider border bg-amber-100 text-amber-700 border-amber-200";
        } else {
            badge.innerText = 'ปกติ';
            badge.className = "px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider border bg-emerald-100 text-emerald-700 border-emerald-200";
        }

        document.getElementById('f_fileUrl').value = data.fileUrl || 'ไม่มีไฟล์';
        const previewImg = document.getElementById('imagePreview');

        if(data.fileUrl && data.fileUrl.startsWith('http')) {
            const isPDF = data.fileUrl.toLowerCase().endsWith('.pdf');
            document.getElementById('f_fileStatus').innerHTML = `📌 <a href="${data.fileUrl}" target="_blank" onclick="event.stopPropagation()" class="text-blue-600 underline font-black hover:text-blue-800 relative z-10">มีไฟล์เดิมแนบอยู่</a>`;
            if (!isPDF) { previewImg.src = data.fileUrl; previewImg.classList.remove('hidden'); }
        } else {
            previewImg.classList.add('hidden');
        }

        // 🌟 เรียกใช้ระบบเช็กสิทธิ์ตอนกดแก้ไข
        setupPermissions(sessionStorage.getItem('osda_user_email'));
    };

    window.deleteRecord = async (id) => {
        const result = await Swal.fire({
            title: 'ยืนยันการลบข้อมูล?',
            text: "ยกเลิกคิวนี้ แต่เลขลำดับจะถูกเก็บไว้ใช้ใหม่ได้",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            confirmButtonText: 'ใช่, ต้องการลบเลย!',
            cancelButtonText: 'ยกเลิก'
        });

        if (result.isConfirmed) {
            Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'delete', sheetType: 'sender', id: String(id) }) 
                });
                await Swal.fire({ icon: 'success', title: 'ลบสำเร็จ!', timer: 1000, showConfirmButton: false });
                await syncDataFromCloud(); 
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด!', text: String(error) });
            }
        }
    };

 // ==========================================
    // 🌟 ระบบดึงเลขว่างอัจฉริยะ (รองรับทั้งเลขเต็มและทศนิยม .01)
    // ==========================================
    function checkAndReuseDeletedSeq() {
        // 1. ดึงเลขทั้งหมดที่มีอยู่ในตารางตอนนี้มาเช็ก
        let existingSeqs = db.map(item => String(item.seq).trim()).filter(s => s !== "");
        if (existingSeqs.length === 0) return Swal.fire({ icon: 'info', title: 'ไม่พบช่องว่าง' });

        // 2. แยกชิ้นส่วนตัวเลข (เลขหลัก กับ เลขทศนิยม)
        let parsed = existingSeqs.map(s => {
            let parts = s.split('.');
            return { 
                main: parseInt(parts[0], 10), 
                sub: parts.length > 1 ? parseInt(parts[1], 10) : 0 
            };
        }).filter(p => !isNaN(p.main));

        if (parsed.length === 0) return Swal.fire({ icon: 'info', title: 'ไม่พบช่องว่าง' });

        let maxMain = Math.max(...parsed.map(p => p.main));
        let missingSeqs = [];

        // 3. ควานหา "เลขหลัก" ที่หายไป (ไล่ตั้งแต่ 1 จนถึงเลขสูงสุด)
        for(let i = 1; i <= maxMain; i++) {
            let expectedMain = String(i).padStart(4, '0');
            // ถ้าเลขหลักนี้ (แบบไม่มีจุด) ไม่มีอยู่ในระบบ ถือว่ามันว่าง!
            if(!existingSeqs.includes(expectedMain)) {
                missingSeqs.push(expectedMain);
            }
        }

        // 4. ควานหา "เลขทศนิยม" ที่หายไป
        let groups = {};
        parsed.forEach(p => {
            if(p.sub > 0) {
                if(!groups[p.main]) groups[p.main] = [];
                groups[p.main].push(p.sub);
            }
        });

        // เช็กทศนิยมทีละหมวดเลขหลัก
        for (let mainNum in groups) {
            let subs = groups[mainNum];
            let maxSub = Math.max(...subs);
            for(let j = 1; j <= maxSub; j++) {
                // ถ้าเลขย่อยตัวไหนหายไป ให้สร้างรูปแบบกลับมา (เช่น 0007.01)
                if(!subs.includes(j)) {
                    let expectedSub = String(mainNum).padStart(4, '0') + '.' + String(j).padStart(2, '0');
                    if(!existingSeqs.includes(expectedSub)){ // กันเหนียว
                        missingSeqs.push(expectedSub);
                    }
                }
            }
        }

        // 5. เรียงลำดับเลขที่หายไปจากน้อยไปมาก ให้ดูง่ายๆ
        missingSeqs.sort((a, b) => parseFloat(a) - parseFloat(b));

        // 6. ถ้าไม่มีอะไรหายไปเลย
        if (missingSeqs.length === 0) {
            return Swal.fire({ icon: 'info', title: 'ข้อมูลต่อเนื่องดีอยู่', text: 'ไม่มีเลขใดถูกลบไปจากระบบ' });
        }

        // 7. สร้างหน้าต่าง Dropdown ให้แอดมินเลือกเลขที่จะนำกลับมาใช้
        let optionsHtml = missingSeqs.map(seq => `<option value="${seq}">ลำดับที่ # ${seq}</option>`).join('');

        Swal.fire({
            title: 'พบเลขทะเบียนที่ว่างอยู่!',
            html: `<select id="swal_select_seq" class="w-full p-3 border rounded-xl font-bold text-center text-lg text-slate-800 bg-amber-50">${optionsHtml}</select>`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d97706',
            confirmButtonText: '✅ ตกลง นำเลขนี้มาใช้',
            cancelButtonText: 'ยกเลิก',
            preConfirm: () => document.getElementById('swal_select_seq').value
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                let seqInput = document.getElementById('f_seq');
                if(seqInput) {
                    seqInput.value = result.value;
                    // เอฟเฟกต์กระพริบสีเขียวเวลาดึงเลขสำเร็จ
                    seqInput.style.setProperty('background-color', '#dcfce3', 'important');
                    setTimeout(() => seqInput.style.setProperty('background-color', '#fff7ed', 'important'), 1000);
                }
            }
        });
    }
</script>
